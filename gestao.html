<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aure Chocolatier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Aure Chocolatier: caderno da maison. Papel creme, vinho profundo, filetes dourados, capitulares em Cinzel como no logo, números em Cormorant */
  --bg:#f7f1ea; --paper:#fffdf9; --ink:#2e1418; --soft:#8c7470; --line:#e9ddd1;
  --wine:#5a0f1c; --wine-2:#741a2b; --gold:#b9824f; --gold-2:#dcb48a; --cream:#fbf3ea;
  --ok:#5e6b3c; --bad:#8f2236;
  --caps:"Cinzel", "Trajan Pro", Georgia, serif;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Jost", ui-sans-serif, system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.num{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;font-weight:600}
.soft{color:var(--soft)}
.it{font-family:var(--serif);font-style:italic}

.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 100px);display:flex;flex-direction:column;gap:34px}

/* cabeçalho no padrão do logo */
.head{display:grid;grid-template-columns:40px 1fr 40px;align-items:start}
.brand{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--wine)}
.brand svg{width:58px;height:34px}
.brand .m{font-family:var(--caps);font-size:30px;font-weight:600;letter-spacing:.08em;line-height:1.05}
.brand .s{display:flex;align-items:center;gap:8px;font-family:var(--caps);font-size:10px;letter-spacing:.32em;color:var(--wine-2)}
.brand .s::before,.brand .s::after{content:"";width:22px;height:1px;background:var(--gold)}
.hbtn{border:1px solid var(--line);background:transparent;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;color:var(--wine)}
.sync{width:6px;height:6px;border-radius:50%;background:var(--line);justify-self:start;margin-top:16px}
.sync.ok{background:var(--ok)} .sync.warn{background:var(--gold)}

/* títulos de seção */
.sec{display:flex;flex-direction:column;gap:12px}
.st{display:flex;align-items:center;gap:12px;font-family:var(--caps);font-size:12px;letter-spacing:.24em;color:var(--wine)}
.st::after{content:"";flex:1;height:1px;background:var(--line)}
.st em{order:2;font-family:var(--serif);font-size:15px;letter-spacing:0;color:var(--soft);font-weight:500}

/* painel vinho com moldura dourada, como os selos */
.seal{background:var(--wine);color:var(--cream);padding:26px 22px 22px;position:relative;text-align:center}
.seal::before{content:"";position:absolute;inset:7px;border:1px solid rgba(220,180,138,.55);pointer-events:none}
.seal::after{content:"";position:absolute;inset:11px;border:1px solid rgba(220,180,138,.22);pointer-events:none}
.seal .k{font-family:var(--caps);font-size:10px;letter-spacing:.3em;color:var(--gold-2)}
.seal .big{font-family:var(--serif);font-size:62px;font-weight:500;line-height:1;margin:6px 0 12px}
.line{height:2px;background:rgba(220,180,138,.25);position:relative;margin:0 6px}
.line i{position:absolute;left:0;top:0;bottom:0;background:var(--gold-2)}
.seal .row3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px}
.seal .row3 div{border-right:1px solid rgba(220,180,138,.3)} .seal .row3 div:last-child{border-right:0}
.seal .row3 b{display:block;font-family:var(--serif);font-size:20px;font-weight:600}
.seal .row3 small{font-family:var(--caps);font-size:9px;letter-spacing:.2em;color:var(--gold-2)}

/* ações */
.acts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--wine)}
.act{border:0;border-right:1px solid var(--wine);background:var(--paper);padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--wine)}
.act:last-child{border-right:0;background:var(--wine);color:var(--cream)}
.act b{font-family:var(--caps);font-size:13px;letter-spacing:.14em;font-weight:600}
.act small{font-family:var(--serif);font-style:italic;font-size:14px;opacity:.8}
.act:active{opacity:.85}

/* livro: linhas */
.book{background:var(--paper);border:1px solid var(--line);padding:2px 16px}
.r{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left;color:var(--ink)}
.r:last-child{border-bottom:0}
button.r:hover .nm{color:var(--wine-2)}
.nm{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--wine);line-height:1.2}
.sub{font-size:12px;color:var(--soft);letter-spacing:.02em}
.right{text-align:right}
.right .num{font-size:22px;color:var(--ink);line-height:1.1}
.right .num.big{font-size:34px;color:var(--wine)}
.lvl{height:2px;background:var(--line);margin-top:8px;position:relative}
.lvl i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
.lvl.low i{background:var(--bad)}
.flag{font-family:var(--caps);font-size:9px;letter-spacing:.2em;color:var(--bad)}
.grp{font-family:var(--caps);font-size:10px;letter-spacing:.26em;color:var(--gold);padding:14px 0 2px}
.addrow{display:block;width:100%;border:0;background:transparent;padding:14px 0;font-family:var(--caps);font-size:11px;letter-spacing:.24em;color:var(--gold);text-align:center}
.mg{font-family:var(--serif);font-style:italic;font-size:14px}

.step{display:flex;align-items:center;gap:10px}
.step button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--wine);font-size:16px;line-height:1}
.step .num{min-width:26px;text-align:center;font-size:22px}
.need{display:flex;flex-direction:column;gap:10px;padding:14px 0 6px;border-top:1px solid var(--line)}
.nr{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px}
.track{height:2px;background:#ecd3d8;position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.tot3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:12px 0 10px;text-align:center}
.tot3 div{border-right:1px solid var(--line)} .tot3 div:last-child{border-right:0}
.tot3 b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;color:var(--wine)}
.tot3 small{font-family:var(--caps);font-size:9px;letter-spacing:.2em;color:var(--soft)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end;height:86px;border-bottom:1px solid var(--line)}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wk i{width:2px;background:var(--gold-2);min-height:2px}
.wk.t i{background:var(--wine);width:2px}
.wk b{font-family:var(--serif);font-size:12px;color:var(--soft);font-weight:500}
.wl{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;text-align:center;font-family:var(--caps);font-size:9px;letter-spacing:.14em;color:var(--soft);margin-top:6px}

.empty{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--soft);text-align:center;padding:18px 0}
.foot{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--gold)}
.foot svg{width:44px;height:26px}
.foot span{font-family:var(--serif);font-style:italic;color:var(--soft);font-size:15px}

/* folha */
.ov{position:fixed;inset:0;z-index:20;background:rgba(46,20,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;padding:0 20px calc(env(safe-area-inset-bottom) + 26px);display:flex;flex-direction:column;gap:20px;animation:up .25s ease-out;border-top:3px solid var(--wine)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:16px 0 12px;z-index:2;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;font-family:var(--caps);font-size:16px;letter-spacing:.2em;font-weight:600;color:var(--wine)}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;color:var(--wine)}
.lab{font-family:var(--caps);font-size:10px;letter-spacing:.24em;color:var(--gold)}

.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--wine);position:relative}
.pill.on{background:var(--wine);border-color:var(--wine);color:var(--cream)}
.pill.add{border-style:dashed;color:var(--gold)}

.card{background:var(--paper);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ch{display:grid;grid-template-columns:1fr 30px;gap:10px;align-items:center}
.rm{border:1px solid var(--line);background:transparent;color:var(--bad);width:30px;height:30px;border-radius:50%;font-size:15px;line-height:1}
.in{border:0;border-bottom:1px solid var(--line);background:transparent;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--wine);padding:4px 0;width:100%;min-width:0}
.in:focus,.q:focus{outline:0;border-bottom-color:var(--gold)}
.qr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q{width:104px;border:0;border-bottom:1px solid var(--gold-2);background:transparent;padding:4px;font-family:var(--serif);font-size:28px;font-weight:600;color:var(--wine);text-align:center}
.u{font-family:var(--caps);font-size:10px;letter-spacing:.2em;color:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 10px;font-size:12px;color:var(--wine)}

.btn{border:1px solid var(--wine);background:transparent;padding:15px 16px;font-family:var(--caps);font-size:12px;letter-spacing:.24em;font-weight:600;color:var(--wine);width:100%}
.btn.p{background:var(--wine);color:var(--cream)}
.btn.del{border:0;color:var(--bad);font-size:10px;padding:8px}
.btn[disabled]{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.res{background:var(--wine);color:var(--cream);padding:18px 8px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;position:relative}
.res::before{content:"";position:absolute;inset:6px;border:1px solid rgba(220,180,138,.45);pointer-events:none}
.res div{border-right:1px solid rgba(220,180,138,.28)} .res div:last-child{border-right:0}
.res b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.15}
.res small{font-family:var(--caps);font-size:8.5px;letter-spacing:.2em;color:var(--gold-2)}

.bigstep{display:flex;align-items:center;justify-content:center;gap:24px}
.bigstep button{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold-2);background:transparent;font-size:22px;color:var(--wine)}
.bigstep input{width:120px;border:0;background:transparent;text-align:center;font-family:var(--serif);font-size:60px;font-weight:500;color:var(--wine)}

.slider{width:100%;accent-color:var(--wine);height:28px}
.srow{display:grid;grid-template-columns:1fr auto;align-items:baseline}
.srow span{font-size:13px}
.zones{display:grid;grid-template-columns:30fr 20fr 30fr 20fr;height:3px;position:relative;margin-top:4px}
.zones s:nth-child(1){background:#dcb0b9}.zones s:nth-child(2){background:#e8d2b3}.zones s:nth-child(3){background:#c9d0ad}.zones s:nth-child(4){background:#8e9a68}
.pin{position:absolute;top:-6px;width:1px;height:15px;background:var(--wine);transform:translateX(-50%)}
.zl{display:grid;grid-template-columns:30fr 20fr 30fr 20fr;font-family:var(--caps);font-size:8.5px;letter-spacing:.16em;color:var(--soft);text-align:center;margin-top:8px}

.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;font-family:var(--serif);font-style:italic;font-size:17px;color:var(--soft)}
.spin{width:30px;height:30px;border:1px solid var(--line);border-top-color:var(--wine);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{border-left:2px solid var(--gold);background:var(--paper);padding:10px 14px;font-family:var(--serif);font-style:italic;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 72px);transform:translateX(-50%);background:var(--wine);color:var(--cream);padding:12px 22px;font-family:var(--caps);font-size:11px;letter-spacing:.18em;z-index:40;max-width:90%;text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:0 0 env(safe-area-inset-bottom)}
.tab{border:0;background:transparent;padding:15px 2px 14px;font-family:var(--caps);font-size:9.5px;letter-spacing:.05em;color:var(--soft);font-weight:600;border-top:2px solid transparent;margin-top:-1px}
.tab.on{color:var(--wine);border-top-color:var(--wine)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);border:1px dashed var(--gold);padding:26px 16px;text-align:center;cursor:pointer;color:var(--wine)}
.drop svg{width:34px;height:34px;color:var(--gold)}
.drop b{font-family:var(--caps);font-size:13px;letter-spacing:.2em;font-weight:600}
.drop span{font-family:var(--serif);font-style:italic;color:var(--soft);font-size:16px}
.was{font-family:var(--serif);font-size:14px;color:var(--soft);text-decoration:line-through;margin-right:6px}
.kpi2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:var(--paper)}
.kpi2 div{padding:14px 16px;border-right:1px solid var(--line)} .kpi2 div:last-child{border-right:0}
.kpi2 b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--wine)}
.kpi2 small{font-family:var(--caps);font-size:9px;letter-spacing:.2em;color:var(--soft)}
.st-pill{font-family:var(--caps);font-size:9px;letter-spacing:.18em}
.st-aberta{color:var(--gold)} .st-pronta{color:var(--ok)} .st-entregue{color:var(--soft)} .st-atrasada{color:var(--bad)}
.cat{background:var(--paper);border:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:22px;text-align:center}
.cat .ch2{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--wine)}
.cat .ch2 svg{width:70px;height:42px}
.cat .ch2 .m{font-family:var(--caps);font-size:30px;font-weight:600;letter-spacing:.08em}
.cat .ch2 .s{font-family:var(--caps);font-size:10px;letter-spacing:.32em}
.ci{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:18px;border-top:1px solid var(--line)}
.ci img{width:100%;max-width:320px;aspect-ratio:4/3;object-fit:cover}
.ci .n2{font-family:var(--caps);font-size:15px;letter-spacing:.14em;color:var(--wine);font-weight:600}
.ci .d{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--soft);max-width:34ch}
.ci .p{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink)}
.photo{display:flex;align-items:center;gap:12px}
.photo img{width:84px;height:64px;object-fit:cover;border:1px solid var(--line)}
.photo .ph{width:84px;height:64px;border:1px dashed var(--gold-2);display:grid;place-items:center;color:var(--gold);font-family:var(--caps);font-size:9px;letter-spacing:.14em}
.parts{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:1px solid var(--line);padding-top:10px}
.parts b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--wine)}
.parts small{font-family:var(--caps);font-size:8.5px;letter-spacing:.16em;color:var(--soft)}
a.btn{display:block;text-align:center;text-decoration:none}
input[type=date].in{font-size:18px}
.ta{width:100%;min-height:96px;border:1px solid var(--line);background:var(--paper);padding:10px 12px;font:400 15px/1.45 var(--sans);color:var(--ink);resize:vertical}
.ta:focus{outline:0;border-color:var(--gold)}
.msgs{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);padding:0 16px}
.msgs a{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--wine)}
.msgs a:last-child{border-bottom:0}
.msgs a b{font-family:var(--serif);font-size:18px;font-weight:600}
.msgs a small{display:block;font-size:12px;color:var(--soft)}
.msgs a span.go{font-family:var(--caps);font-size:9px;letter-spacing:.2em;color:var(--gold)}
.badge{font-family:var(--caps);font-size:8.5px;letter-spacing:.16em;border:1px solid currentColor;padding:2px 6px;margin-left:6px;vertical-align:2px}
.b-ok{color:var(--ok)} .b-meio{color:var(--gold)} .b-sem{color:var(--bad)}
.search{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;font-family:var(--serif);font-size:18px;color:var(--ink)}
.search:focus{outline:0;border-bottom-color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== camada macia: cantos redondos, sombras suaves, toque com resposta ===== */
:root{ --bg:#f6efe9; --paper:#fffcf8; --fill:#f7efe7; --line:#efe3d8; --r:22px;
  --shadow:0 1px 2px rgba(90,15,28,.04),0 10px 28px -12px rgba(90,15,28,.14);
  --spring:cubic-bezier(.22,1,.36,1); }
body{background:var(--bg);-webkit-font-smoothing:antialiased}
button,a,.r,.pill,.btn,.act,.tab,.step button,.bigstep button,.chips button{transition:transform .22s var(--spring),background-color .2s ease,box-shadow .2s ease,color .2s ease}
button:active,a:active{transform:scale(.96)}
.r:active{transform:scale(.985)}
.wrap{gap:30px;padding-bottom:calc(env(safe-area-inset-bottom) + 130px)}
.hbtn{border:0;background:var(--paper);box-shadow:var(--shadow);width:42px;height:42px}
.sync{margin-top:18px}

.st{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:0;color:var(--wine)}
.st::after{display:none}
.st em{font-family:var(--sans);font-style:normal;font-size:13px;color:var(--soft);font-weight:400}
.lab{font-family:var(--sans);font-size:12.5px;letter-spacing:.01em;color:var(--soft);font-weight:500}

.seal{border-radius:28px;overflow:hidden;box-shadow:0 16px 36px -16px rgba(90,15,28,.55)}
.seal::before{border-radius:22px;inset:8px} .seal::after{border-radius:19px;inset:12px}
.seal .k{font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;font-weight:400}
.line{height:6px;border-radius:99px;overflow:hidden} .line i{border-radius:99px}
.seal .row3 small,.res small,.tot3 small,.kpi2 small,.parts small{font-family:var(--sans);font-size:11.5px;letter-spacing:.01em;font-weight:400}

.acts{border:0;gap:10px}
.act{border:0;border-radius:24px;background:var(--paper);box-shadow:var(--shadow);padding:18px 6px 15px;gap:4px}
.act:last-child{background:var(--wine);box-shadow:0 12px 26px -12px rgba(90,15,28,.6)}
.act b{font-family:var(--sans);font-size:15.5px;letter-spacing:.01em;font-weight:500}
.act small{font-family:var(--sans);font-style:normal;font-size:12px;opacity:.7}

.book{border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:4px 18px}
.r{border-bottom-color:var(--line);padding:15px 0}
.grp{font-family:var(--sans);font-size:12px;letter-spacing:.02em;font-weight:500;padding-top:16px}
.lvl{height:5px;border-radius:99px;background:var(--fill);overflow:hidden} .lvl i{border-radius:99px}
.flag{font-family:var(--sans);font-size:11px;letter-spacing:.02em;font-weight:500}
.addrow{font-family:var(--sans);font-size:14px;letter-spacing:.01em;font-weight:500}
.kpi2{border:0;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.kpi2 div{border-right-color:var(--line)}

.step button{border:0;background:var(--fill);width:38px;height:38px;font-size:18px}

async function salvarCompra(){
  readCompra();
  const itens = cd.itens.filter(i=>(i.nome||S.ing[i.match]) && (i.cat==='equipamento' || i.qtd>0));
  if(!itens.length){ toast('Escolha um item e informe a quantidade'); return; }
  const b = ov.querySelector('[data-act=c-salvar]'); b.disabled = true;
  try{
    const work = {}, reg = [];
    for (const it of itens){
      if (it.cat==='equipamento'){ reg.push({nome:it.nome,cat:'equipamento',qtd:it.qtd||1,valor:it.valor}); continue; }
      let id = it.match;
      if (!id || !S.ing[id]){ const ex = Object.values(work).find(w=>norm(w.nome)===norm(it.nome)); id = ex?ex.id:uid(); if(!work[id]) work[id] = {id,nome:it.nome,cat:it.cat,unid:CATS[it.cat]?.u||'g',estoque:0,custo:0,comprado:0,minimo:0}; }
      else if(!work[id]) work[id] = clone(S.ing[id]);
      const w = work[id], est = Math.max(0,w.estoque||0);
      w.custo = (est*(w.custo||0)+it.valor)/(est+it.qtd); w.estoque = (w.estoque||0)+it.qtd; w.comprado = Math.max(0,w.estoque);
      reg.push({nome:w.nome,cat:w.cat,qtd:it.qtd,valor:it.valor,ingId:id});
    }
    const antes = Object.fromEntries(prods().map(p=>[p.id,custo(p).v]));
    for (const w of Object.values(work)) await put('ingredientes',w.id,w);
    await put('compras',uid(),{data:cd.data||hoje(),loja:cd.loja||'Compra',total:sum(reg,r=>r.valor||0),itens:reg});
    UI.antes = antes; UI.tab = 'preco'; close(); later(); window.scrollTo(0,0); toast('Estoque e custos atualizados');
  }catch(e){ b.disabled = false; }
}
function matchIng(nome){ const toks = norm(nome).split(/[^a-z0-9]+/).filter(t=>t.length>=4 && !['pote','banda','quebr','torrado'].includes(t)); let best = null, sc = 0; for(const i of ings()){ const n = norm(i.nome); const s = toks.filter(t=>n.includes(t)).length; if(s>sc){ sc=s; best=i; } } return best?best.id:''; }
async function shrink(file){ const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src = URL.createObjectURL(file); }); const k = Math.min(1,1800/Math.max(img.width,img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(r,'image/jpeg',.85)); }

async function lerNota(files){

  try{
    const lim = sample && sample.limits ? await sample.limits() : null;
    if(!sample || (lim && !lim.images)) throw {code:'not_granted'};
    const images = []; for(const f of files) images.push(await shrink(f));
    const prompt = `Você lê cupons fiscais e recibos de compras de uma chocolateria artesanal no Brasil. Extraia os itens das imagens e responda SOMENTE com JSON:
{"loja":"nome curto","data":"AAAA-MM-DD","itens":[{"nome":"nome claro e curto","categoria":"chocolate|castanha|fruta|embalagem|outro|equipamento","quantidade":0,"valor":0}]}
Regras: produto por kg -> quantidade em GRAMAS (0,216 kg = 216). Produto com peso no nome (ex.: 2,01kg) -> gramas x unidades. Embalagens (caixas, papel, fitas, forminhas de papel, adesivos) = embalagem, em unidades. Formas, moldes e utensílios = equipamento, em unidades. chocolate = chocolates e coberturas; castanha = castanhas, nozes, amendoim, sementes; fruta = frutas secas, desidratadas, coco. valor = valor final pago pela linha, já com desconto da linha; desconto no subtotal: distribua proporcionalmente. Junte linhas repetidas do mesmo produto.`;

function readFiz(){ if(!ov) return; fd.pecas = parseNum($('#f-pecas').value); ov.querySelectorAll('[data-u]').forEach(el=>{ const u = fd.usos[+el.dataset.u]; if(u) u.qtd = parseNum(el.querySelector('[data-f=qtd]').value); }); }

async function salvarFiz(){

function baixa(items,s){ const out = {}; for(const [id,q] of items){ const p = S.prod[id]; if(!p) continue; if(p.tipo==='kit') (p.kit||[]).forEach(k=>{ if(S.prod[k.prodId]) out[k.prodId]=(out[k.prodId]||0)+s*k.qtd*q; }); else out[id]=(out[id]||0)+s*q; } return out; }
async function salvarVenda(){
  const items = Object.entries(cart).filter(([id,q])=>q>0 && S.prod[id]); if(!items.length) return;
  const b = ov.querySelector('[data-act=v-ok]'); b.disabled = true;

}

function compor(o, P=PR()){
  if(o.q==='+') return null;

  if(o.s==='Sortida'){ pc = Math.max(...P.sabores.map(x=>pecaCusto(P,o.f,x[2],o.c))); }

  else { const sb = P.sabores.find(x=>x[0]===o.s); if(!sb) return null; graos = sb[2]; pc = pecaCusto(P,o.f,graos,o.c); }
  const F = P.fmt[o.f], emb = Number((P.emb[o.f]||{})[o.q])||0;

  return montarPedido({cliente,entrega,hora,f,q:+m[1],s:s||'Sortida',c,mix,valor,obs});
}

const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);

function pushStatus(){
  if(!(window.firebase && firebase.apps && firebase.apps.length)) return ['off','Funciona quando o app estiver publicado com o Firebase.'];
  if(ehIOS() && !instalado()) return ['ios','No iPhone, primeiro salve o app na tela de início: no Safari, toque em Compartilhar › Adicionar à Tela de Início. Depois abra pelo ícone da Aure e volte aqui.'];

async function fotoData(file){ const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src = URL.createObjectURL(file); }); const k = Math.min(1,640/Math.max(img.width,img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.78); }

const SOFT_SEL = '.st,.lab,.btn,.act b,.act small,.seal .k,.row3 small,.tot3 small,.kpi2 small,.parts small,.res small,.addrow,.zl span,.flag,.st-pill,.badge,.grp,.u,.wl span,.msgs .go';
const FIXW = [[/whatsapp/gi,'WhatsApp'],[/\bpix\b/gi,'Pix'],[/\bifood\b/gi,'iFood'],[/\bkg\b/gi,'kg']];
function softText(n){ const t = n.nodeValue; if(!/[A-ZÁÉÍÓÚÂÊÔÃÕÇ]{2}/.test(t) || t!==t.toUpperCase()) return; let s = t.toLowerCase().replace(/^([^a-zà-ÿ]*)([a-zà-ÿ])/,(m,a,b)=>a+b.toUpperCase()); FIXW.forEach(([r,v])=>{ s = s.replace(r,v); }); n.nodeValue = s; }
function soften(root){ const els = []; if(root.matches && root.matches(SOFT_SEL)) els.push(root); if(root.querySelectorAll) els.push(...root.querySelectorAll(SOFT_SEL)); els.forEach(el=>el.childNodes.forEach(n=>{ if(n.nodeType===3) softText(n); })); }
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1) soften(n); else if(n.nodeType===3 && n.parentElement && n.parentElement.matches(SOFT_SEL)) softText(n); }))).observe(document.body,{childList:true,subtree:true});
